<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Driver Activity Tracker</title>
<meta name="description" content="Track which drivers drive, on which days, and how often.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%232f6f9f'/%3E%3Cpath d='M3 11l3-4 3 2 4-5' fill='none' stroke='%23fff' stroke-width='1.6'/%3E%3C/svg%3E">
<script>try{var t=localStorage.getItem('driverActivityTracker.theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<a class="skip" id="skip" href="#">Skip to content</a>
<div class="app">
  <aside class="sidebar">
    <div class="brand">Driver Activity</div>
    <nav id="nav" aria-label="Main">
      <a href="#/dashboard" data-route="dashboard">Dashboard</a>
      <a href="#/drivers" data-route="drivers">Drivers</a>
      <a href="#/records" data-route="records">Records</a>
      <a href="#/statistics" data-route="statistics">Statistics</a>
      <a href="#/settings" data-route="settings">Settings</a>
    </nav>
    <button id="themeBtn" class="btn ghost" type="button">Dark theme</button>
  </aside>
  <main id="view" tabindex="-1"><noscript>This app needs JavaScript enabled.</noscript></main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="js/utils/dateUtils.js"></script>
<script src="js/services/validation.js"></script>
<script src="js/storage/storage.js"></script>
<script src="js/services/stats.js"></script>
<script src="js/charts/charts.js"></script>
<script src="js/views/dashboard.js"></script>
<script src="js/views/drivers.js"></script>
<script src="js/views/driver.js"></script>
<script src="js/views/records.js"></script>
<script src="js/views/statistics.js"></script>
<script src="js/app.js"></script>
</body>
</html>
